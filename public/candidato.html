<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adaptaecom - Processo seletivo</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #e6e8eb;
    --muted: #9aa2af;
    --accent: #ee4d2d;
    --ok: #3ecf8e;
    --warn: #f5a623;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin: 0 0 12px 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 12px 18px; font-size: 15px; cursor: pointer; font-weight: 600; width: 100%;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input, textarea {
    background: #0f1115; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; width: 100%; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 90px; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .msg { margin-top: 14px; font-size: 13px; }
  .msg.ok { color: var(--ok); }
  .msg.erro { color: var(--danger); }
  .sucesso { text-align: center; padding: 20px 0; }
  .sucesso .icone { font-size: 40px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Adaptaecom — Processo seletivo</h1>
  <div class="subtitle">Preencha seus dados e responda as perguntas abaixo. Nossa equipe vai avaliar sua inscrição.</div>

  <div class="card" id="cardForm">
    <h2>Seus dados</h2>
    <div class="field">
      <label>Nome completo</label>
      <input id="nome" type="text" placeholder="Seu nome completo" />
    </div>
    <div class="field">
      <label>E-mail</label>
      <input id="email" type="email" placeholder="voce@email.com" />
    </div>
    <div class="field">
      <label>Telefone (com DDD)</label>
      <input id="telefone" type="tel" placeholder="(11) 99999-9999" />
    </div>

    <div id="perguntasWrap"></div>

    <div class="field">
      <button id="btnEnviar">Enviar inscrição</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card sucesso" id="cardSucesso" style="display:none;">
    <div class="icone">✅</div>
    <div><strong>Inscrição recebida!</strong></div>
    <div style="color: var(--muted); margin-top: 8px;">
      Obrigado pelo interesse. Nossa equipe vai avaliar suas respostas e entrar em contato pelo e-mail informado.
    </div>
  </div>
</div>

<script>
let perguntasAtuais = [];

async function carregarPerguntas() {
  const wrap = document.getElementById('perguntasWrap');
  try {
    const res = await fetch('/api/candidatos/perguntas');
    const data = await res.json();
    perguntasAtuais = data.perguntas || [];
    wrap.innerHTML = perguntasAtuais.map((p, i) => `
      <div class="field">
        <label>${i + 1}. ${p.texto}</label>
        <textarea data-pergunta-id="${p.id}"></textarea>
      </div>
    `).join('');
  } catch (e) {
    wrap.innerHTML = '<div class="msg erro">Erro ao carregar as perguntas. Recarregue a página.</div>';
  }
}

async function enviarInscricao() {
  const nome = document.getElementById('nome').value.trim();
  const email = document.getElementById('email').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnEnviar');

  const respostas = Array.from(document.querySelectorAll('textarea[data-pergunta-id]')).map((el) => ({
    pergunta_id: el.getAttribute('data-pergunta-id'),
    resposta: el.value.trim(),
  }));

  if (!nome || !email) {
    msg.className = 'msg erro';
    msg.textContent = 'Preencha nome e e-mail.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const res = await fetch('/api/candidatos/inscrever', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome, email, telefone, respostas }),
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('cardForm').style.display = 'none';
      document.getElementById('cardSucesso').style.display = 'block';
    } else {
      msg.className = 'msg erro';
      msg.textContent = data.erro || 'Erro ao enviar inscrição.';
    }
  } catch (e) {
    msg.className = 'msg erro';
    msg.textContent = 'Erro ao enviar inscrição. Tente novamente.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar inscrição';
  }
}

document.getElementById('btnEnviar').addEventListener('click', enviarInscricao);
carregarPerguntas();
</script>
</body>
</html>
